<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0A1C38">
<meta name="robots" content="noindex,nofollow">
<title>AI PediScan+ Mobile — Foot &amp; Nail Assessment</title>
<style>
@font-face{font-family:Pretendard;font-weight:400;src:local('Pretendard'),local('Inter'),local('-apple-system')}
:root{
  --navy:#0A1C38; --navy2:#16335C; --blue:#2E6BE6; --blue-l:#5B9BFF;
  --cream:#F4EFE4; --mut:#9DB2CE; --gold:#D6972C;
  --ink:#14181F; --ink2:#48535F; --ink3:#6E7A88;
  --bg:#EEF1F5; --card:#FFFFFF; --line:#DAE1EA; --line2:#EDF1F6;
  --ok:#0F7A4D; --warn:#B4600A; --red:#B3261E;
  --tint:#F5F8FC; --tintw:#FFF7EC; --tintr:#FDF2F1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;word-break:normal;overflow-wrap:break-word;
}
img{max-width:100%}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

/* ── header ── */
.hd{
  position:sticky;top:0;z-index:40;background:var(--navy);color:var(--cream);
  padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:2px solid var(--blue);
}
.hd .lg{display:flex;align-items:center;gap:9px;min-width:0}
.hd .lg img{height:22px;width:auto;display:block}
.hd .who{text-align:right;min-width:0;flex-shrink:1}
.hd .who b{display:block;font-size:12px;font-weight:600;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.hd .who span{display:block;font-size:10px;color:var(--mut);margin-top:1px}

/* ── tab bar ── */
.tb{
  position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);max-width:520px;margin:0 auto;
}
.tb button{
  flex:1;background:none;border:none;padding:9px 2px 8px;cursor:pointer;
  color:var(--ink3);font-size:10.5px;font-weight:600;letter-spacing:.01em;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.tb button svg{width:21px;height:21px;stroke-width:1.9}
.tb button.on{color:var(--navy)}
.tb button.on svg{stroke-width:2.3}
.wrap{padding:18px 16px 96px}

/* ── typography ── */
.vt{font-size:21px;font-weight:700;letter-spacing:-.5px;margin:0 0 3px;color:var(--navy)}
.vs{font-size:12.5px;color:var(--ink3);margin:0 0 16px;line-height:1.55}
.gl{
  font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.06em;text-transform:uppercase;
  margin:22px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:7px;
}
.gl i{font-style:normal;font-size:10px;color:var(--blue);font-weight:800;font-variant-numeric:tabular-nums}
.gl s{text-decoration:none;font-weight:500;color:var(--ink3);text-transform:none;letter-spacing:0;font-size:10.5px;margin-left:auto}

/* ── card ── */
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px}
.c.flat{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.ch h3{margin:0;font-size:14.5px;font-weight:700;color:var(--navy);letter-spacing:-.2px}
.ch .no{font-size:10px;font-weight:700;color:var(--blue);background:var(--tint);border:1px solid #D5E2F5;border-radius:5px;padding:2px 7px;font-variant-numeric:tabular-nums}
.p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.68}
.p+.p{margin-top:8px}
.sm{font-size:12px;color:var(--ink3);line-height:1.6}

/* ── buttons ── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px 16px;border-radius:12px;border:none;font-size:15px;font-weight:700;
  cursor:pointer;letter-spacing:-.2px;
}
.btn.pri{background:var(--navy);color:var(--cream)}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.sm{padding:10px 13px;font-size:13px;border-radius:10px;width:auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:9px}
.row>*{flex:1}

/* ── form ── */
.f{margin-bottom:12px}
.f label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.f input,.f select,.f textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:#fff;outline:none;font-size:15px;
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue)}
.f textarea{min-height:76px;resize:vertical;line-height:1.6}
.f .hint{font-size:11px;color:var(--ink3);margin-top:5px;line-height:1.5}

/* ── chips ── */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:8px 12px;border-radius:9px;border:1.5px solid var(--line);background:#fff;
  font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;line-height:1.35;text-align:left;
}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--cream)}
.chip.warn{border-color:#EBC9A8;color:var(--warn);background:var(--tintw)}
.chip.warn.on{background:var(--red);border-color:var(--red);color:#fff}

/* ── slider ── */
.ms{border-top:1px solid var(--line2);padding:13px 0 3px}
.ms:first-child{border-top:none;padding-top:2px}
.ms .t{display:flex;align-items:baseline;justify-content:space-between;gap:9px;margin-bottom:2px}
.ms .k{font-size:9.5px;font-weight:800;color:var(--blue);letter-spacing:.1em}
.ms .nm{font-size:13.5px;font-weight:700;color:var(--navy)}
.ms .ds{font-size:11px;color:var(--ink3);margin-bottom:9px}
.ms .lv{font-size:19px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.ms input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;background:linear-gradient(90deg,#BFD4F0,#2E6BE6);outline:none;margin:4px 0 2px}
.ms input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--navy);border:3px solid #fff;box-shadow:0 1px 5px rgba(10,28,56,.35);cursor:pointer}
.ms input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--navy);border:3px solid #fff;cursor:pointer}
.ms .sc{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);margin-top:1px}

/* ── score ── */
.score{display:flex;align-items:flex-end;gap:13px;padding:4px 0 12px;border-bottom:1px solid var(--line2);margin-bottom:12px}
.score b{font-size:44px;line-height:.92;font-weight:700;color:var(--navy);letter-spacing:-2px;font-variant-numeric:tabular-nums}
.score .u{font-size:13px;color:var(--ink3);font-weight:600;padding-bottom:5px}
.score .bd{margin-left:auto;text-align:right;padding-bottom:4px}
.score .bd b{display:block;font-size:13.5px;letter-spacing:-.2px}
.score .bd span{font-size:10.5px;color:var(--ink3)}
.bar{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line2)}
.bar:first-of-type{border-top:none}
.bar .l{flex:0 0 104px;min-width:0}
.bar .l b{display:block;font-size:12.5px;font-weight:700;color:var(--navy);line-height:1.28;word-break:keep-all}
.bar .l span{font-size:9.5px;color:var(--blue);font-weight:800;letter-spacing:.08em}
.bar .g{flex:1;height:7px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar .g i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.bar .g i.w{background:#E0A040}.bar .g i.r{background:var(--red)}
.bar .v{flex:0 0 30px;text-align:right;font-size:13px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}

/* ── result blocks ── */
.al{border-radius:13px;padding:14px 15px;margin-bottom:11px;border:1px solid}
.al.red{background:var(--tintr);border-color:#E8B7B3}
.al.warn{background:var(--tintw);border-color:#EBD5AE}
.al.ok{background:#F0F8F3;border-color:#B9DFC9}
.al h4{margin:0 0 6px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.al.red h4{color:var(--red)}.al.warn h4{color:var(--warn)}.al.ok h4{color:var(--ok)}
.al p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.65}
.al ul{margin:7px 0 0;padding-left:17px;font-size:12.5px;color:var(--ink2);line-height:1.65}

/* scope card */
.scope{border-radius:14px;overflow:hidden;margin-bottom:11px;border:1px solid var(--line)}
.scope .sh{padding:14px 16px;color:var(--cream)}
.scope .sh .k{font-size:10px;font-weight:800;letter-spacing:.14em;opacity:.85}
.scope .sh h3{margin:3px 0 0;font-size:17px;font-weight:700;letter-spacing:-.4px;line-height:1.3}
.scope .sh p{margin:6px 0 0;font-size:12.5px;line-height:1.6;opacity:.92}
.scope .sb{background:#fff;padding:13px 16px}
.scope.a .sh{background:linear-gradient(135deg,#0F6B48,#0A4A32)}
.scope.b .sh{background:linear-gradient(135deg,var(--navy2),var(--navy))}
.scope.c .sh{background:linear-gradient(135deg,#8A5510,#5E3806)}
.scope.d .sh{background:linear-gradient(135deg,#A32820,#6E1A14)}

ul.li{margin:0;padding:0;list-style:none}
ul.li li{position:relative;padding:5px 0 5px 15px;font-size:13px;color:var(--ink2);line-height:1.62}
ul.li li:before{content:"";position:absolute;left:2px;top:13px;width:4px;height:4px;border-radius:50%;background:var(--blue)}

.fac{border-top:1px solid var(--line2);padding:11px 0}
.fac:first-child{border-top:none;padding-top:2px}
.fac h4{margin:0 0 4px;font-size:13.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.fac .tg{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:.04em}
.fac .tg.h{background:#FBE9E7;color:#9A2B21}
.fac .tg.m{background:#FFF3E0;color:#8A5510}
.fac .tg.q{background:var(--tint);color:var(--blue)}
.fac p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.65}

/* procedure */
.proc{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:10px}
.proc .ph{background:var(--navy);color:var(--cream);padding:12px 14px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
.proc .ph::-webkit-details-marker{display:none}
.proc .ph .tt{flex:1;min-width:0}
.proc .ph .sc{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--blue-l)}
.proc .ph b{display:block;font-size:14px;font-weight:700;margin-top:2px;letter-spacing:-.2px}
.proc .ph .cv{flex:0 0 auto;font-size:10.5px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.proc .ph .cv svg{width:13px;height:13px;transition:transform .18s}
.proc[open] .ph .cv svg{transform:rotate(180deg)}
.proc .pb{padding:12px 14px;background:#fff}
.proc .pb>p{margin:0 0 9px;font-size:12.5px;color:var(--ink2);line-height:1.65}
.step{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line2)}
.step .n{flex:0 0 21px;height:21px;border-radius:50%;background:var(--tint);color:var(--blue);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step .c2{flex:1;min-width:0}
.step .c2 b{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:2px}
.step .c2 p{margin:0;font-size:12px;color:var(--ink2);line-height:1.6}
.step .c2 .w{margin-top:5px;font-size:11.5px;color:var(--warn);background:var(--tintw);border-radius:7px;padding:6px 9px;line-height:1.55}
.note{margin-top:10px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line2);padding-top:9px;line-height:1.6}

/* products */
.prod{display:flex;gap:11px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.prod:first-child{border-top:none}
.prod .im{flex:0 0 52px;height:52px;border-radius:10px;background:#F4F0EC;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.prod .im img{width:100%;height:100%;object-fit:contain}
.prod .im span{font-size:9px;color:var(--ink3);text-align:center;padding:3px;line-height:1.25}
.prod .tx{flex:1;min-width:0}
.prod .tx b{display:block;font-size:13px;font-weight:700;color:var(--navy);letter-spacing:-.2px}
.prod .tx s{display:block;text-decoration:none;font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.5}
.prod .tx u{display:block;text-decoration:none;font-size:11px;color:var(--blue);font-weight:700;margin-top:4px}
.cat{display:inline-block;font-size:9.5px;font-weight:800;color:var(--blue);background:var(--tint);border:1px solid #D5E2F5;border-radius:5px;padding:2px 6px;letter-spacing:.03em}

/* referral */
.ref{display:flex;gap:11px;align-items:center;padding:11px 0;border-top:1px solid var(--line2)}
/* 우리 클리닉 관리 — 목록 한 줄 + 켜고끄기 스위치 */
.care{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line2)}
.care .m{flex:1;min-width:0}
.care .m b{display:block;font-size:14px;font-weight:650;line-height:1.35;color:var(--ink)}
.care .m span{display:block;font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.5}
.care.off .m b,.care.off .m span{color:var(--ink3)}
.care.off .m b{text-decoration:line-through;text-decoration-color:var(--line)}
.sw{position:relative;flex:0 0 auto;width:42px;height:24px;margin-top:2px;padding:0;border:none;
    border-radius:999px;background:#C6D0DC;cursor:pointer;transition:background .15s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
          background:#fff;box-shadow:0 1px 3px rgba(10,28,56,.28);transition:transform .15s}
.sw.on{background:var(--blue)}
.sw.on:after{transform:translateX(18px)}
.ref:first-child{border-top:none}
.ref .av{flex:0 0 40px;height:40px;border-radius:11px;background:var(--navy);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.ref .av.s{background:var(--blue)}
.ref .m{flex:1;min-width:0}
.ref .m b{display:block;font-size:13px;font-weight:700;color:var(--navy)}
.ref .m span{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px;line-height:1.45}
.ref a{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--blue);text-decoration:none;padding:7px 10px;border:1.5px solid var(--line);border-radius:9px}

/* record rows */
.rec{display:flex;gap:11px;align-items:center;padding:11px 0;border-top:1px solid var(--line2);cursor:pointer}
.rec:first-child{border-top:none}
.rec .av{flex:0 0 40px;height:40px;border-radius:11px;background:var(--tint);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.rec .m{flex:1;min-width:0}
.rec .m b{display:block;font-size:13.5px;font-weight:700;color:var(--navy)}
.rec .m span{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
.rec .s{flex:0 0 auto;text-align:right}
.rec .s b{display:block;font-size:16px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.rec .s span{font-size:9.5px;color:var(--ink3)}

/* photos */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pg .th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#F4F0EC;border:1px solid var(--line)}
.pg .th img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.pg .th button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(10,28,56,.82);color:#fff;border:none;font-size:14px;line-height:1;cursor:pointer;padding:0}
.pbtn{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;border:1.5px dashed var(--line);border-radius:11px;background:#fff;color:var(--navy);font-size:13px;font-weight:700;cursor:pointer}
/* 아직 값이 없는 항목 — 0(정상)처럼 보이면 안 된다 */
.ms.unset{opacity:.62}
.ms.unset .lv{color:var(--ink3);font-size:12px;font-weight:700;letter-spacing:.3px}
.ms.unset input[type=range]{filter:grayscale(1)}
.ms .unsetnote{font-size:11.5px;line-height:1.5;color:var(--ink3);margin-top:5px}

/* 3컷 촬영 슬롯 */
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.shot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
      aspect-ratio:.82;padding:7px 5px;border:1.5px dashed var(--line);border-radius:11px;background:#fff;cursor:pointer;overflow:hidden}
.shot svg{width:21px;height:21px;color:var(--ink3);flex:0 0 auto}
.shot b{font-size:10px;font-weight:700;color:var(--ink2);text-align:center;line-height:1.28;z-index:2}
.shot .n{position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;background:var(--line2);color:var(--ink2);
         font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:3}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot.has{border-style:solid;border-color:var(--navy)}
.shot.has b{position:absolute;left:0;right:0;bottom:0;padding:4px 3px 5px;background:rgba(10,28,56,.78);color:#fff}
.shot.has .n{background:var(--navy);color:#fff}
.shot .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(10,28,56,.82);
         color:#fff;border:none;font-size:13px;line-height:1;cursor:pointer;padding:0;z-index:3}

/* 플랜 선택 */
.plan{display:grid;gap:7px}
.pl{display:block;width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;cursor:pointer}
.pl b{display:block;font-size:13px;font-weight:800;color:var(--navy);margin-bottom:3px}
.pl s{display:block;text-decoration:none;font-size:11.5px;line-height:1.5;color:var(--ink3)}
.pl.on{border-color:var(--navy);background:#FBF8F5;box-shadow:inset 0 0 0 1px var(--navy)}
.pl.on s{color:var(--ink2)}

/* 접기 카드 — 사진이 채워 주는 것은 접어 둔다. 필요할 때만 연다. */
.fold{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:11px;overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:9px;
  font-size:14.5px;font-weight:700;color:var(--navy);letter-spacing:-.2px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .cn{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--ink3);text-align:right}
.fold>summary .ar{flex:0 0 auto;width:7px;height:7px;margin-left:10px;
  border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);
  transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.fold[open]>summary .ar{transform:rotate(-135deg) translateY(-2px)}
.fold .fin{padding:0 16px 16px}
.chip .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);
  margin-right:5px;vertical-align:middle}
.chip.on .dot{background:var(--cream)}

.seg{display:flex;background:var(--line2);border-radius:10px;padding:3px;margin-bottom:11px}
.seg button{flex:1;background:none;border:none;padding:8px 6px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink3);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(10,28,56,.12)}

/* trend */
.tr{display:flex;align-items:flex-end;gap:7px;height:92px;padding:6px 0 0}
.tr .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.tr .b i{display:block;width:100%;max-width:34px;background:var(--blue);border-radius:4px 4px 0 0;min-height:4px}
.tr .b i.last{background:var(--navy)}
.tr .b em{font-style:normal;font-size:11px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.tr .b s{text-decoration:none;font-size:9px;color:var(--ink3);white-space:nowrap}

/* lightbox */
.lb{display:none;position:fixed;inset:0;z-index:90;background:rgba(6,14,26,.96)}
.lb img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:100%;max-height:86vh}
.lb .x{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:none;font-size:19px;cursor:pointer}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:none;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb .nv.p{left:10px}.lb .nv.n{right:10px}
.lb .ct{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 16px);left:0;right:0;text-align:center;color:var(--mut);font-size:12px}

/* modal */
.md{display:none;position:fixed;inset:0;z-index:80;background:rgba(10,20,32,.5);align-items:flex-end;justify-content:center}
.md.on{display:flex}
.md .in{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;max-height:90vh;overflow-y:auto;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px)}
.md h3{margin:0 0 4px;font-size:17px;font-weight:700;color:var(--navy)}
.md .sub{font-size:12px;color:var(--ink3);margin-bottom:15px}

.tst{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;z-index:95;opacity:0;pointer-events:none;transition:opacity .22s;max-width:88%;text-align:center}
.tst.on{opacity:1}

.jump{display:flex;gap:7px;overflow-x:auto;padding:0 0 4px;margin:-6px 0 14px;-webkit-overflow-scrolling:touch}
.jump button{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:7px 10px;font-size:11px;font-weight:700;color:var(--navy);cursor:pointer;white-space:nowrap}
.disc{font-size:10.5px;color:var(--ink3);line-height:1.6;background:var(--tint);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--tint);color:var(--blue);border:1px solid #D5E2F5}
.em{text-align:center;padding:34px 18px;color:var(--ink3);font-size:13px;line-height:1.7}
.hr{height:1px;background:var(--line2);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line2);font-size:12.5px}
.kv:first-child{border-top:none}
.kv b{color:var(--navy);font-weight:700}
.kv span{color:var(--ink2);text-align:right}
table.sz{width:100%;border-collapse:collapse;font-size:12.5px}
table.sz th,table.sz td{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:right}
table.sz th:first-child,table.sz td:first-child{text-align:left}
table.sz th{font-size:10.5px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
table.sz td{color:var(--ink2);font-variant-numeric:tabular-nums}


/* 헤더 우측 — 클리닉 정보 + 언어 전환 */
.hd .hdr{display:flex;align-items:center;gap:10px;min-width:0}
.hd .lang{flex:0 0 auto;background:rgba(255,255,255,.12);border:1px solid rgba(244,239,228,.28);color:var(--cream);
  border-radius:8px;padding:5px 9px;font-size:11px;font-weight:800;letter-spacing:.05em;cursor:pointer}
/* AI 판독 카드 */
.c.ai{border-color:#C9D8EE;background:linear-gradient(160deg,#FFFFFF,#F4F9FF)}
.c.ai .no{background:var(--blue);color:#fff;border-color:var(--blue)}
.airow{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line2)}
.airow:first-child{border-top:none}
.airow .l{flex:0 0 104px;min-width:0}
.airow .l b{display:block;font-size:12.5px;font-weight:700;color:var(--navy);line-height:1.28;word-break:keep-all}
.airow .l span{font-size:9.5px;color:var(--blue);font-weight:800;letter-spacing:.08em}
.airow .g{flex:1;height:7px;background:var(--line2);border-radius:4px;overflow:hidden}
.airow .g i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.airow .g i.w{background:#E0A040}.airow .g i.r{background:var(--red)}
.airow .v{flex:0 0 30px;text-align:right;font-size:13px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.conf{display:flex;align-items:center;gap:9px;margin:11px 0 0;padding-top:10px;border-top:1px solid var(--line2)}
.conf .cb{flex:1;height:6px;background:var(--line2);border-radius:4px;overflow:hidden}
.conf .cb i{display:block;height:100%;background:var(--ok);border-radius:4px}
.conf .cb i.mid{background:#E0A040}.conf .cb i.low{background:var(--red)}
.conf b{font-size:11.5px;color:var(--navy);font-weight:700;white-space:nowrap}
.demo{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.05em;
  padding:3px 8px;border-radius:6px;background:var(--tintw);color:var(--warn);border:1px solid #EBD5AE}
.spin{width:17px;height:17px;border:2.5px solid rgba(244,239,228,.35);border-top-color:var(--cream);
  border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{
  .hd,.tb,.noprint{display:none!important}
  body{background:#fff}.wrap{padding:0}
  .c,.proc,.scope{break-inside:avoid;box-shadow:none}
}
</style>
</head>

 {id:'fungal',tg:'q',
  nm:{en:'Discolouration and thickening that only a lab test can explain',
      fr:'Décoloration et épaississement que seule une analyse peut expliquer'},
  lv:{en:'Needs confirming',fr:'À confirmer'},
  when:(m,o)=>m.una>=3&&(has(o,'discolour')||has(o,'thick')||has(o,'crumble')||has(o,'lifting')),
  why:{en:'Discolouration, thickening and crumbling are present alongside the recorded surface score. Trauma and skin conditions can look the same, so confirming this needs a nail sample and a clinician — it cannot be settled by looking.',
       fr:'La décoloration, l’épaississement et l’effritement accompagnent le score de surface noté. Un traumatisme ou une affection cutanée peuvent donner la même apparence ; la confirmation exige un prélèvement et un clinicien — l’examen visuel ne suffit pas.'}},
 {id:'trauma',tg:'m',
  nm:{en:'Repeated impact',fr:'Impacts répétés'},
  lv:{en:'Possible',fr:'Possible'},
  when:(m,o)=>has(o,'dark')||has(o,'sport'),
  why:{en:'Running and downhill walking push the toes forward into the shoe. Repeated contact can bruise under the nail or change how the plate grows.',
       fr:'La course et la descente poussent les orteils vers l’avant de la chaussure. Les contacts répétés peuvent provoquer un hématome sous l’ongle ou modifier sa pousse.'}},
 {id:'load',tg:'m',
  nm:{en:'Uneven load through the forefoot',fr:'Charge inégale sur l’avant-pied'},
  lv:{en:'Possible',fr:'Possible'},
  when:(m,o)=>m.cot>=3||has(o,'fore_callus')||(m.cls>=4&&has(o,'standing')),
  why:{en:'A deviated great toe, or long hours standing, concentrates load on one part of the forefoot. Callus builds there first, and nail pressure follows the same pattern.',
       fr:'Un gros orteil dévié, ou de longues heures debout, concentrent la charge sur une zone de l’avant-pied. La corne s’y forme en premier, et la pression sur l’ongle suit le même schéma.'}},
 {id:'dry',tg:'m',
  nm:{en:'Dry skin and repeated friction',fr:'Peau sèche et frottements répétés'},
  lv:{en:'Possible',fr:'Possible'},
  when:(m,o)=>m.cls>=3||has(o,'dry'),
  why:{en:'When the outer skin layer loses water and friction keeps up, callus thickens and eventually splits. This is the usual path to heel fissures.',
       fr:'Quand la couche externe de la peau perd son eau et que le frottement persiste, la corne s’épaissit puis se fend. C’est le chemin habituel vers les fissures du talon.'}},
 {id:'moist',tg:'m',
  nm:{en:'A damp environment',fr:'Milieu humide persistant'},
  lv:{en:'Possible',fr:'Possible'},
  when:(m,o)=>has(o,'macerated'),
  why:{en:'Skin that stays damp between the toes loses its barrier. Socks, footwear and how thoroughly the feet are dried are worth going through.',
       fr:'Une peau qui reste humide entre les orteils perd sa barrière. Il vaut la peine de revoir les chaussettes, les chaussures et le séchage des pieds.'}},
 {id:'sys',tg:'q',
  nm:{en:'Underlying health factors',fr:'Facteurs de santé sous-jacents'},
  lv:{en:'Needs confirming',fr:'À confirmer'},
  when:(m,o)=>has(o,'diabetes')||has(o,'circul')||has(o,'numb'),
  why:{en:'Blood flow and sensation change how quickly things heal and how much a client can feel going wrong. Confirm the current status before deciding how much to do in one visit.',
       fr:'La circulation et la sensibilité influencent la vitesse de guérison et la capacité du client à percevoir un problème. Vérifiez l’état actuel avant de décider de l’ampleur de l’intervention.'}},
 {id:'recur',tg:'m',
  nm:{en:'The original cause is still there',fr:'La cause initiale persiste'},
  lv:{en:'Possible',fr:'Possible'},
  when:(m,o)=>has(o,'recurred'),
  why:{en:'If the same toe has flared before, something in the footwear, the cutting or the gait has not changed. Treating the nail without changing that gets you the same call in a few months.',
       fr:'Si le même orteil a déjà posé problème, quelque chose n’a pas changé dans la chaussure, la coupe ou la marche. Traiter l’ongle sans corriger cela ramène le même appel quelques mois plus tard.'}}
];

/* ── 시술 항목 — 이름과 한 줄 설명만 ──
   이 제품은 "이런 상태에는 이런 처치가 있다"까지만 다룹니다.
   단계별 방법(어떻게 하는지)은 캐나다판 페디스캔의 범위가 아니라 넣지 않습니다.
   scope: routine / advanced / medical                              */
const PROC={
 reduction:{scope:'advanced',
  t:{en:'Nail reduction (mechanical debridement)',fr:'Réduction de l’ongle (débridement mécanique)'},
  d:{en:'Bringing a thickened, discoloured plate back down to an even, comfortable surface.',
     fr:'Ramener une tablette épaissie et décolorée à une surface régulière et confortable.'}},
 bracing:{scope:'advanced',
  t:{en:'Orthonyxia — shape-memory nail brace',fr:'Orthonyxie — orthèse unguéale à mémoire de forme'},
  d:{en:'A shape-memory wire or brace fitted to the nail, applying steady gentle lift so the curve opens over weeks. Non-invasive, and the principle is the same whichever brand you use.',
     fr:'Un fil ou une orthèse à mémoire de forme posé sur l’ongle, exerçant une traction douce et continue pour ouvrir la courbure en quelques semaines. Non invasif ; le principe est le même quelle que soit la marque.'}},
 callus:{scope:'advanced',
  t:{en:'Callus reduction',fr:'Réduction des callosités'},
  d:{en:'Reducing thickened skin on the heel or forefoot back to a comfortable level, then dealing with why it built up there.',
     fr:'Ramener la peau épaissie du talon ou de l’avant-pied à un niveau confortable, puis traiter la cause de son accumulation.'}},
 pna:{scope:'medical',
  t:{en:'Partial nail avulsion, with or without matricectomy',fr:'Avulsion partielle de l’ongle, avec ou sans matricectomie'},
  d:{en:'A minor surgical procedure that removes the offending nail border, sometimes with a chemical applied to the matrix so it does not regrow. Performed under local anaesthetic by a podiatrist or physician.',
     fr:'Intervention mineure retirant le bord d’ongle en cause, parfois avec application d’un agent chimique sur la matrice pour éviter la repousse. Réalisée sous anesthésie locale par un podiatre ou un médecin.'}},
 antifungal:{scope:'medical',
  t:{en:'Laboratory confirmation, then prescribed treatment',fr:'Analyse de confirmation, puis traitement prescrit'},
  d:{en:'Confirmation needs a nail clipping or scraping sent for testing. Treatment — topical or oral — is prescribed and monitored by a regulated professional.',
     fr:'La confirmation exige un prélèvement d’ongle envoyé en analyse. Le traitement — topique ou oral — est prescrit et suivi par un professionnel réglementé.'}},
 offload:{scope:'routine',
  t:{en:'Offloading and footwear review',fr:'Décharge et révision des chaussures'},
  d:{en:'Taking pressure off the area that keeps taking too much — padding, a footwear change, or a referral for an orthotic assessment.',
     fr:'Soulager la zone qui supporte trop de pression — rembourrage, changement de chaussures, ou orientation vers une évaluation orthétique.'}},
 diabetic:{scope:'medical',
  t:{en:'Diabetic foot risk check',fr:'Évaluation du risque du pied diabétique'},
  d:{en:'A structured check of circulation, sensation and skin integrity that sets how often the client should be seen and by whom.',
     fr:'Un examen structuré de la circulation, de la sensibilité et de l’intégrité cutanée qui détermine la fréquence du suivi et par qui.'}}
};

const SERVICES=[
 {k:'reduction',nm:{en:'Nail reduction',fr:'Réduction de l’ongle'}},
 {k:'bracing',  nm:{en:'Orthonyxia bracing',fr:'Orthonyxie'}},
 {k:'callus',   nm:{en:'Callus reduction',fr:'Réduction des callosités'}},
 {k:'laser',    nm:{en:'Laser adjunct',fr:'Laser en appoint'}},
 {k:'pna',      nm:{en:'Partial nail avulsion',fr:'Avulsion partielle'}},
 {k:'offload',  nm:{en:'Padding / offloading',fr:'Rembourrage / décharge'}},
 {k:'orthotic', nm:{en:'Orthotic assessment',fr:'Évaluation orthétique'}},
 {k:'diabetic', nm:{en:'Diabetic foot check',fr:'Examen du pied diabétique'}}
];

/* ── 제품 분류 — 제품 자체는 각 클리닉이 등록한다 ── */
/* ── 노출 조건 ──────────────────────────────────────────────
   클리닉이 등록한 관리 항목은 여기서 고른 조건이 하나라도 맞을 때만 결과에 나온다(OR).
   판단 기준을 새로 만들지 않았다 — 규칙엔진이 이미 쓰던 need* 를 그대로 이름만 붙인 것이다. */
const TRIGS=[
 {k:'una3',  nm:{en:'Nail discolouration or thickening',   fr:'Ongle décoloré ou épaissi'}},
 {k:'cnl3',  nm:{en:'Nail curling or ingrowing',           fr:'Ongle qui s’enroule ou s’incarne'}},
 {k:'cls3',  nm:{en:'Callus or dry skin',                  fr:'Corne ou peau sèche'}},
 {k:'crack', nm:{en:'Heel fissures',                       fr:'Fissures du talon'}},
 {k:'cot3',  nm:{en:'Forefoot pressure or alignment',      fr:'Pression ou alignement de l’avant-pied'}},
 {k:'fungal',nm:{en:'Fungal appearance recorded',          fr:'Aspect fongique consigné'}},
 {k:'severe',nm:{en:'Marked nail involvement',             fr:'Atteinte unguéale marquée'}},
 {k:'hist',  nm:{en:'Medical history recorded',            fr:'Antécédents médicaux consignés'}},
 {k:'always',nm:{en:'Always show',                         fr:'Toujours afficher'}}
];

/* 첫 실행 때 심어 줄 기본 관리 — PROC 를 그대로 쓰되 조건과 순서만 얹는다.
   심고 나면 클리닉 것이 되어, 여기를 고쳐도 이미 쓰는 기기에는 영향이 없다. */
const CARE_SEED=[
 {k:'reduction', trig:['una3']},
 {k:'bracing',   trig:['cnl3']},
 {k:'callus',    trig:['cls3','crack']},
 {k:'antifungal',trig:['fungal']},
 {k:'pna',       trig:['severe']},
 {k:'offload',   trig:['cot3']},
 {k:'diabetic',  trig:['hist']}
];

const PCATS=[
 {k:'nail-serum',  nm:{en:'Nail & cuticle conditioning',fr:'Soin de l’ongle et de la cuticule'},
                   when:{en:'Curling edges, brittle or dry nail folds',fr:'Bords qui s’enroulent, replis secs ou fragiles'}},
 {k:'nail-surface',nm:{en:'Nail surface conditioning',fr:'Soin de surface de l’ongle'},
                   when:{en:'Discoloured or thickened plate',fr:'Tablette décolorée ou épaissie'}},
 {k:'file',        nm:{en:'Nail file / surface tool',fr:'Lime / outil de surface'},
                   when:{en:'Keeping the surface even between visits',fr:'Garder la surface régulière entre les visites'}},
 {k:'callus-cream',nm:{en:'Callus & dry skin cream',fr:'Crème pour corne et peau sèche'},
                   when:{en:'Thick or dry skin on the foot',fr:'Peau épaisse ou sèche du pied'}},
 {k:'callus-tool', nm:{en:'Callus tool',fr:'Outil à corne'},
                   when:{en:'Home maintenance of hard skin',fr:'Entretien de la corne à domicile'}},
 {k:'heel-balm',   nm:{en:'Heel balm',fr:'Baume pour talons'},
                   when:{en:'Deep heel fissures',fr:'Fissures profondes du talon'}},
 {k:'hygiene',     nm:{en:'Foot wash / deodorising',fr:'Lavage / désodorisation des pieds'},
                   when:{en:'Damp skin between the toes',fr:'Peau humide entre les orteils'}}
];

</script>
<!-- engine.js -->
<script>
/* ═══════════════════════════════════════════════════════════
   AI PediScan+ Mobile — 판단 엔진
   순서: 안전 확인 → 등급 → 시술 선택지 → 제품 분류 → 문서 생성
   전부 기기 안에서 돈다. 서버 없이 동작.
   ═══════════════════════════════════════════════════════════ */
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const has=(a,v)=>a.indexOf(v)>=0;

/* ── 언어 ── */
let LANG='en';
function tt(o){ if(o==null) return ''; if(typeof o==='string') return o; return o[LANG]!=null?o[LANG]:(o.en||''); }
function t(path){
  const parts=String(path).split('.');
  let node=UI;
  for(const p of parts){ if(node==null) break; node=node[p]; }
  return node==null?path:tt(node);
}

/* ── 측정 ── */
const lvIdx=v=>v>=6?2:v>=3?1:0;
const sc1=v=>100-v*10;
/* 기록된 항목만으로 계산한다 — 안 찍힌 항목을 0(정상)으로 세면 점수가 실제보다 좋아진다 */
const isSet=(m,k)=>m[k]!=null;
const setKeys=m=>META.filter(x=>isSet(m,x.k)).map(x=>x.k);
const score=m=>{ const ks=setKeys(m); if(!ks.length) return null;
  return Math.round(ks.reduce((a,k)=>a+sc1(m[k]),0)/ks.length); };
const band=s=>s>=90?t('band.stable'):s>=80?t('band.watch'):s>=65?t('band.attention'):t('band.priority');
const bandNote=s=>s>=90?t('band.nStable'):s>=80?t('band.nWatch'):s>=65?t('band.nAttention'):t('band.nPriority');
const obsLabel=id=>{
  for(const g of OBS){ const f=g.v.find(x=>x.id===id); if(f) return tt(f); }
  const p=PAIN.find(x=>x.id===id); return p?tt(p):id;
};
const catName=k=>{const c=PCATS.find(x=>x.k===k);return c?tt(c.nm):k;};
const catWhen=k=>{const c=PCATS.find(x=>x.k===k);return c?tt(c.when):'';};

/* ═══════════════════════════════════════════════════════════
   판단
   ═══════════════════════════════════════════════════════════ */
function analyze(rec){
  const m=rec.ms, o=rec.obs, out={};

  /* 1. 안전 확인 */
  out.red=RED_FLAGS.filter(v=>has(o,v));
  out.caution=CAUTIONS.filter(v=>has(o,v));

  /* 2. 측정 해석 */
  out.score=score(m);
  /* 사진에 안 나왔고 손으로도 넣지 않은 항목은 결과에서 아예 뺀다.
     안 본 부위를 두고 무엇이든 말하는 순간 근거 없는 추정이 된다. */
  out.items=META.filter(x=>isSet(m,x.k)).map(x=>({k:x.k,nm:tt(x.nm),sub:x.sub,ds:tt(x.ds),lv:m[x.k],s:sc1(m[x.k]),
                          txt:tt(x.txt)[lvIdx(m[x.k])],utxt:tt(x.utxt)[lvIdx(m[x.k])]}));
  out.unset=META.filter(x=>!isSet(m,x.k)).map(x=>({k:x.k,nm:tt(x.nm),sub:x.sub}));

  /* 3. 원인 추정 */
  out.factors=FACTORS.filter(f=>f.when(m,o)).map(f=>({nm:tt(f.nm),lv:tt(f.lv),tg:f.tg,why:tt(f.why)}));

  /* 4. 무엇이 필요한가 */
  const needReduction = m.una>=3 || has(o,'discolour')||has(o,'thick')||has(o,'crumble')||has(o,'lifting');
  const needBracing   = m.cnl>=3 || has(o,'edge_one')||has(o,'edge_both')||has(o,'fold_swollen')||has(o,'tender');
  const needCallus    = m.cls>=3 || has(o,'heel_callus')||has(o,'fore_callus')||has(o,'fissure');
  const needOffload   = m.cot>=3 || has(o,'fore_callus')||has(o,'standing');
  const suspectFungal = m.una>=5 && (has(o,'discolour')||has(o,'crumble')||has(o,'lifting'));
  const severeNail    = m.cnl>=7 || (rec.pain==='severe'&&needBracing) || (has(o,'recurred')&&m.cnl>=6);
  const medicalHist   = out.caution.length>0;
  out.need={needReduction,needBracing,needCallus,needOffload,suspectFungal,severeNail,medicalHist};

  /* 5. 등급 — 이 앱의 핵심 판단 */
  let tier='A';
  if(out.red.length) tier='D';
  else if(suspectFungal||severeNail||(medicalHist&&(needReduction||needBracing||needCallus))) tier='C';
  else if(needReduction||needBracing||needCallus) tier='B';
  out.tier=tier;

  /* 6. 시술 선택지 */
  const opts=[];
  if(needReduction) opts.push('reduction');
  if(needBracing) opts.push('bracing');
  if(needCallus) opts.push('callus');
  if(suspectFungal) opts.push('antifungal');
  if(severeNail) opts.push('pna');
  if(needOffload) opts.push('offload');
  if(medicalHist) opts.push('diabetic');
  out.options=opts;

  /* 6-1. 조건 히트 — 클리닉이 등록한 관리 항목을 고르는 데 쓴다.
     위에서 이미 계산한 need* 를 이름만 붙여 내보내는 것이라 기준이 갈라지지 않는다. */
  const hits=[];
  if(needReduction) hits.push('una3');
  if(needBracing) hits.push('cnl3');
  if(needCallus) hits.push('cls3');
  if(has(o,'fissure')||m.cls>=6) hits.push('crack');
  if(needOffload) hits.push('cot3');
  if(suspectFungal) hits.push('fungal');
  if(severeNail) hits.push('severe');
  if(medicalHist) hits.push('hist');
  hits.push('always');
  out.hits=hits;

  /* 7. 제품 분류 — 실제 제품은 클리닉 카탈로그에서 */
  const cats=new Set();
  if(needBracing) cats.add('nail-serum');
  if(needReduction){cats.add('nail-surface');cats.add('file');}
  if(needCallus){cats.add('callus-cream');cats.add('callus-tool');}
  if(has(o,'fissure')||m.cls>=6) cats.add('heel-balm');
  if(has(o,'macerated')) cats.add('hygiene');
  if(!cats.size) cats.add('callus-cream');
  out.cats=[...cats];

  /* 8. 생활 안내 — p: 임상용 / u: 손님용 */
  const L=LANG;
  const life=[];
  const add=(p_en,u_en,p_fr,u_fr)=>life.push({p:L==='fr'?p_fr:p_en, u:L==='fr'?u_fr:u_en});
  if(has(o,'cut_round')||has(o,'cut_short'))
    add('Show the client how to cut straight across, leaving the nail just past the skin, and to stop digging out the corners.',
        'Cut your nails straight across and leave them just past the skin. Do not dig out the corners.',
        'Montrez au client comment couper droit, en laissant l’ongle dépasser légèrement la peau, et cesser de creuser les coins.',
        'Coupez vos ongles droit et laissez-les dépasser légèrement la peau. Ne creusez pas les coins.');
  if(has(o,'narrow')||m.cnl>=4)
    add('Check the width of their everyday shoe at the ball of the foot against the foot itself.',
        'Wear shoes with room across the widest part of your foot, so your toes are not squeezed together.',
        'Comparez la largeur de leur chaussure de tous les jours à l’avant-pied avec le pied lui-même.',
        'Portez des chaussures assez larges à l’endroit le plus large du pied, pour que vos orteils ne soient pas comprimés.');
  if(has(o,'macerated'))
    add('Go through drying between the toes and what socks they wear all day.',
        'Dry carefully between your toes after washing, and change into dry socks if your feet get damp during the day.',
        'Revoyez le séchage entre les orteils et le type de chaussettes portées toute la journée.',
        'Séchez bien entre vos orteils après le lavage, et changez de chaussettes si vos pieds deviennent humides pendant la journée.');
  if(m.cls>=3||has(o,'heel_callus'))
    add('Tell them not to pick or over-file at home, and to keep the cream going daily rather than in bursts.',
        'Do not pick or file the hard skin yourself. Use your cream every day rather than only when it gets bad.',
        'Dites-leur de ne pas gratter ni limer à l’excès à la maison, et d’appliquer la crème tous les jours plutôt que par périodes.',
        'Ne grattez pas et ne limez pas la corne vous-même. Appliquez votre crème tous les jours, et non seulement quand ça empire.');
  if(has(o,'diabetes')||has(o,'numb'))
    add('Daily visual check, and a clear instruction to call rather than wait if anything opens up.',
        'Look at your feet every day, including between the toes. If you find a cut, blister or anything that is not healing, call us instead of waiting for your next visit.',
        'Vérification visuelle quotidienne, avec la consigne claire d’appeler plutôt que d’attendre si une lésion apparaît.',
        'Examinez vos pieds chaque jour, y compris entre les orteils. Si vous trouvez une coupure, une ampoule ou une lésion qui ne guérit pas, appelez-nous au lieu d’attendre le prochain rendez-vous.');
  if(m.cot>=3||has(o,'fore_callus'))
    add('Note where the load sits and whether an orthotic assessment is worth arranging.',
        'Pressure is sitting on one part of your forefoot. An insole assessment may take some of that load off.',
        'Notez où se concentre la charge et si une évaluation orthétique vaut la peine.',
        'La pression se concentre sur une partie de votre avant-pied. Une évaluation de semelles pourrait soulager cette charge.');
  if(!life.length)
    add('Nothing needs changing. Keep the current routine and record it again at the next visit.',
        'Your routine is working. Keep doing what you are doing, and we will look again next visit.',
        'Rien à changer. Maintenir la routine actuelle et revoir à la prochaine visite.',
        'Votre routine fonctionne. Continuez ainsi, et nous reverrons cela à la prochaine visite.');
  out.life=life;

  /* 9. 재방문 간격 */
  const R={en:{d:'Not set — observations outside the four readings were recorded',c:'2 to 4 weeks',
               b:'4 to 6 weeks',r:'6 to 8 weeks',a:'10 to 12 weeks'},
           fr:{d:'Non défini — des observations hors des quatre lectures ont été consignées',c:'2 à 4 semaines',
               b:'4 à 6 semaines',r:'6 à 8 semaines',a:'10 à 12 semaines'}}[LANG];
  out.review = tier==='D'?R.d : tier==='C'?R.c : needBracing?R.b : needReduction?R.r : R.a;

  return out;
}

/* 측정 신호 카드 — 무엇이 기록됐는지만 말한다.
   어디로 보낼지·무엇을 할지는 앱이 정하지 않는다(성대표님 2026-08-11). */
function tierCard(out){
  const M={A:{cls:'a',k:'tier.aK',h:'tier.aH',p:'tier.aP'},
           B:{cls:'b',k:'tier.bK',h:'tier.bH',p:'tier.bP'},
           C:{cls:'c',k:'tier.cK',h:'tier.cH',p:'tier.cP'},
           D:{cls:'d',k:'tier.dK',h:'tier.dH',p:'tier.dP'}}[out.tier];
  return {cls:M.cls, k:t(M.k), h:t(M.h), p:t(M.p)};
}

/* ═══════════════════════════════════════════════════════════
   AI 판독 — 페디스캔 엔진 호출
   서버가 연결돼 있으면 그쪽 판독을 쓰고,
   데모 모드에서는 데모임을 명시한 값으로 시연만 한다.
   ═══════════════════════════════════════════════════════════ */
/* images = [{view:'topdown'|'closeup'|'sole', data:'data:image/…'}]
   세 컷 다 있으면 네 항목이 다 채워지고, 한 컷만 있으면 그 컷이 보여주는 것만 채워진다.
   여러 컷을 한 요청으로 보낸다 — 컷마다 부르면 판독 비용이 컷 수만큼 늘어난다. */
async function aiRead(images, contact){
  const list=Array.isArray(images)?images:[{view:'closeup',data:images}];
  const views=list.map(i=>i.view);
  if(CFG.api){
    const r=await fetch(CFG.api.replace(/\/$/,'')+'/analyze',{
      method:'POST',
      headers:Object.assign({'Content-Type':'application/json'}, CFG.key?{'Authorization':'Bearer '+CFG.key}:{}),
      body:JSON.stringify({images:list, contact:contact||''})
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d||!d.levels) throw new Error('no levels');
    /* 사진에 안 나온 항목은 판독하지 않는다 —
       응답에 없는 키를 0으로 채우면 '정상'으로 잘못 읽힌다. */
    const lv={};
    META.forEach(x=>{ const v=d.levels[x.k];
      if(v!=null&&v!=='') lv[x.k]=Math.max(0,Math.min(10,Math.round(Number(v)))); });
    return {levels:lv,
            findings:Array.isArray(d.findings)?d.findings.filter(isObsId):[],
            confidence:typeof d.confidence==='number'?d.confidence:null,
            quality:d.quality||null, engine:d.engine||'AI PediScan+', demo:false,
            views:Array.isArray(d.views)&&d.views.length?d.views:views};
  }
  if(CFG.demo) return demoRead(list);
  throw new Error('not configured');
}
const isObsId=id=>OBS.some(g=>g.v.some(x=>x.id===id));

/* 데모 판독 — 사진의 색·대비에서 값을 만들어 보여주기만 한다.
   실제 판독이 아니며 화면에 그렇게 표시되고, 기록에도 demo 로 남는다. */
function demoRead(list){
  const views=list.map(i=>i.view), dataUrl=list[0].data;
  /* 데모도 찍힌 컷이 보여주는 항목만 채운다 — 실제 판독과 같은 규칙이라야 시연이 오해를 안 낳는다 */
  const canSee=new Set(); views.forEach(v=>(SHOT_SCALES[v]||[]).forEach(k=>canSee.add(k)));
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{
      const n=48, cv=document.createElement('canvas'); cv.width=n; cv.height=n;
      const cx=cv.getContext('2d'); cx.drawImage(im,0,0,n,n);
      let d; try{ d=cx.getImageData(0,0,n,n).data; }catch(e){ return rej(e); }
      let rs=0,gs=0,bs=0,lum=[],px=n*n;
      for(let i=0;i<d.length;i+=4){
        rs+=d[i];gs+=d[i+1];bs+=d[i+2];
        lum.push(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
      }
      const R=rs/px,G=gs/px,B=bs/px;
      const mean=lum.reduce((a,b)=>a+b,0)/px;
      const sd=Math.sqrt(lum.reduce((a,b)=>a+(b-mean)*(b-mean),0)/px);
      let edge=0;
      for(let y=1;y<n;y++)for(let x=1;x<n;x++){
        const i=(y*n+x), j=((y-1)*n+x), k=(y*n+x-1);
        edge+=Math.abs(lum[i]-lum[j])+Math.abs(lum[i]-lum[k]);
      }
      edge/=(n*n*2);
      const clamp=v=>Math.max(0,Math.min(10,Math.round(v)));
      const yellow=(R+G)/2-B;                 // 노란기
      const raw={
        una: clamp(yellow/9 + sd/34),          // 변색·불균일
        cnl: clamp(edge/3.2 + (255-mean)/95),  // 윤곽 대비
        cls: clamp(sd/22 + edge/5.5),          // 질감 거칠기
        cot: clamp(edge/7 + yellow/22)         // 형태 편차
      };
      const lv={}; Object.keys(raw).forEach(k=>{ if(canSee.has(k)) lv[k]=raw[k]; });
      const f=[];
      if(lv.una>=4) f.push('discolour');
      if(lv.una>=6) f.push('thick');
      if(lv.cnl>=4) f.push('edge_one');
      if(lv.cnl>=7) f.push('fold_swollen');
      if(lv.cls>=4) f.push('heel_callus');
      if(lv.cls>=7) f.push('dry');
      res({levels:lv,findings:f,confidence:0.62+Math.min(0.24,edge/220),
           quality:mean<45||mean>225?'low':'good',engine:'demo',demo:true,views:views});
    };
    im.onerror=rej; im.src=dataUrl;
  });
}

/* ═══════════════════════════════════════════════════════════
   손님 안내문 · 의뢰 소견 메모
   ═══════════════════════════════════════════════════════════ */
function buildClientNote(rec,out){
  const fr=LANG==='fr', L=[];
  const who=rec.name||(fr?'Bonjour':'there');
  L.push(fr?`Bonjour ${rec.name||''}, voici le résumé de votre visite du ${fmtDate(rec.date)}.`
           :`Hi ${who}, here is a summary of your visit on ${fmtDate(rec.date)}.`);
  L.push('');
  L.push(fr?`VOTRE SCORE AUJOURD’HUI — ${out.score} sur 100 (${band(out.score)})`
           :`YOUR SCORE TODAY — ${out.score} out of 100 (${band(out.score)})`);
  const hi=out.items.filter(i=>i.lv>=3).sort((a,b)=>b.lv-a.lv);
  if(hi.length) hi.slice(0,2).forEach(i=>L.push(`• ${i.nm}: ${i.utxt}`));
  else L.push(fr?'• Les quatre lectures se situent dans une plage confortable.'
                :'• All four readings are in a comfortable range.');
  L.push('');
  if(out.red.length){
    L.push(fr?'ÉGALEMENT CONSIGNÉ AUJOURD’HUI':'ALSO RECORDED TODAY');
    out.red.forEach(v=>L.push(`• ${obsLabel(v)}`));
    L.push(fr?'Ces éléments ne font pas partie des quatre lectures. Nous en avons parlé ensemble lors de la visite.'
             :'These are not part of the four readings. We went over them with you during the visit.');
    L.push('');
  }
  L.push(fr?'INFORMATIONS GÉNÉRALES':'GENERAL INFORMATION');
  out.life.forEach(x=>L.push(`• ${x.u}`));
  L.push('');
  if(out.prodList&&out.prodList.length){
    L.push(fr?'PRODUITS DONT NOUS AVONS PARLÉ':'PRODUCTS WE WENT OVER');
    out.prodList.forEach(p=>L.push(`• ${p.name}${p.size?' ('+p.size+')':''}${p.how?' — '+p.how:''}`));
    L.push('');
  }
  L.push(fr?`PROCHAINE VISITE SUGGÉRÉE — ${out.review}`:`SUGGESTED NEXT VISIT — ${out.review}`);
  L.push('');
  L.push(`${CFG.clinic||(fr?'Notre clinique':'Our clinic')}${CFG.user?' · '+CFG.user:''}`);
  L.push(fr?'Ce résumé rapporte ce qui a été mesuré et consigné aujourd’hui. Ce n’est pas un diagnostic. Si quelque chose change avant votre prochaine visite, contactez-nous ou votre médecin.'
           :'This summary reports what was observed and recorded today. It is not a diagnosis. If anything changes before your next visit, contact us or your doctor.');
  return L.join('\n');
}

function buildReferral(rec,out){
  /* 측정 결과 요약 — 해석 없이 이번 방문에 기록된 것만.
     의뢰 여부는 클리닉이 정한다(성대표님 2026-08-11). */
  const fr=LANG==='fr', L=[];
  L.push(fr?'RÉSUMÉ DE LA VISITE':'VISIT SUMMARY');
  L.push(`${rec.name||''}${rec.contact?'  ·  '+rec.contact:''}`);
  L.push(fr?`Visite du ${fmtDate(rec.date)} — ${CFG.clinic||''}${CFG.city?', '+CFG.city:''}`
           :`Visit of ${fmtDate(rec.date)} — ${CFG.clinic||''}${CFG.city?', '+CFG.city:''}`);
  L.push('');
  L.push(fr?'LECTURES (0 = rien de notable, 10 = très marqué)':'READINGS (0 = not notable, 10 = pronounced)');
  out.items.forEach(i=>L.push(`  • ${i.nm} (${i.sub}): ${i.lv}/10`));
  L.push(fr?`  • Score global : ${out.score}/100`:`  • Composite: ${out.score}/100`);
  if(out.unset.length)
    L.push(fr?`  • Non consigné cette visite : ${out.unset.map(u=>u.nm).join(', ')} — non visible sur les photos prises.`
             :`  • Not recorded this visit: ${out.unset.map(u=>u.nm).join(', ')} — not visible in the photos taken.`);
  if(rec.aiUsed) L.push(fr?`  • Lecture par le moteur AI PediScan+, confirmée sur place${rec.aiConf!=null?' ('+Math.round(rec.aiConf*100)+' %)':''}.`
                          :`  • Read by the AI PediScan+ engine and confirmed on site${rec.aiConf!=null?' ('+Math.round(rec.aiConf*100)+'%)':''}.`);
  L.push('');
  const plain=rec.obs.filter(v=>!has(RED_FLAGS,v)&&!has(CAUTIONS,v));
  if(plain.length){
    L.push(fr?'OBSERVATIONS CONSIGNÉES':'OBSERVATIONS RECORDED');
    plain.forEach(v=>L.push(`  • ${obsLabel(v)}`)); L.push('');
  }
  if(out.caution.length){
    L.push(fr?'ANTÉCÉDENTS RAPPORTÉS PAR LE CLIENT':'HISTORY REPORTED BY THE CLIENT');
    out.caution.forEach(v=>L.push(`  • ${obsLabel(v)}`)); L.push('');
  }
  if(out.red.length){
    L.push(fr?'CONSIGNÉ HORS DES QUATRE LECTURES':'RECORDED OUTSIDE THE FOUR READINGS');
    out.red.forEach(v=>L.push(`  • ${obsLabel(v)}`)); L.push('');
  }
  if(rec.pain&&rec.pain!=='none'){ L.push(`${fr?'Douleur rapportée':'Pain reported'}: ${obsLabel(rec.pain)}`); L.push(''); }
  if(rec.note){ L.push(fr?'NOTES':'NOTES'); L.push(`  ${rec.note}`); L.push(''); }
  L.push(fr?`Prochaine visite suggérée : ${out.review}`:`Suggested next visit: ${out.review}`);
  L.push('');
  L.push(fr?'Ce résumé rapporte les lectures et les observations consignées lors de la visite. Aucune interprétation ni aucun diagnostic n’y est ajouté.'
           :'This summary reports the readings and observations recorded at the visit. No interpretation or diagnosis is included.');
  L.push('');
  L.push(`${CFG.user||''}`);
  L.push(`${CFG.clinic||''}${CFG.city?'  ·  '+CFG.city:''}`);
  return L.join('\n');
}

<script>
/* ═══════════════════════════════════════════════════════════
   AI PediScan+ Mobile — 화면·저장
   저장은 전부 기기 안(IndexedDB, 안 되면 localStorage).
   ═══════════════════════════════════════════════════════════ */

/* 판독 서비스 주소는 기본값으로 넣어 둔다 — 클리닉은 키만 입력하면 된다.
   키는 앱에 넣지 않는다(앱 파일이 돌아다니면 키도 같이 돌아다닌다). */
let CFG={plan:'lite',clinic:'',user:'',city:'',type:'podiatry',svc:[],
         api:'https://pediscan-reading.vercel.app/api',key:'',demo:false,transfer:null,lang:'en',
         care:null};
/* Mobile 은 양발을 한 컷에 담는 제품이다 — 발 단위(좌/우)가 애초에 없다.
   발별 상세는 한 발당 카메라 6대로 찍는 Device 몫이다. */
let REFS=[], CATALOGUE=[], RECORDS=[], cur={}, step=1, pendPhotos=[],
    editP=null, editR=null, editC=null, aiResult=null;

/* 플랜 — Lite 는 이 기기에서 끝나고, Connected 는 서버에 남아 방문끼리 잇는다.
   Lite 에서는 못 쓰는 기능을 비활성으로 두지 않고 아예 안 보이게 한다(있는데 안 되는 것처럼 보이지 않게). */
const isConnected=()=>CFG.plan==='connected';
function setPlan(v){
  CFG.plan=v;
  $('#pl-lite').classList.toggle('on',v==='lite');
  $('#pl-connected').classList.toggle('on',v==='connected');
}

/* 정규 3컷 — 각 컷에서 실제로 볼 수 있는 항목만 판독한다.
   전부 찍으면 네 항목이 다 채워지고, 한 장만 찍으면 그 컷이 보여주는 것만 채워진다. */
const SHOTS=[{k:'topdown',t:'s2.shotTopdown'},{k:'closeup',t:'s2.shotCloseup'},{k:'sole',t:'s2.shotSole'}];
const SHOT_SCALES={topdown:['cnl','una','cot'],closeup:['cnl','una'],sole:['cls']};
let aiShots={};

/* ── 저장소 ── */
let DB=null;
function idbOpen(){return new Promise(res=>{
  if(!window.indexedDB)return res(null);
  let rq;try{rq=indexedDB.open('pediscan_mobile',1);}catch(e){return res(null);}
  rq.onupgradeneeded=e=>{const db=e.target.result;
    if(!db.objectStoreNames.contains('records'))db.createObjectStore('records',{keyPath:'id'});
    if(!db.objectStoreNames.contains('media')){const s=db.createObjectStore('media',{keyPath:'id'});s.createIndex('recId','recId');}
    if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta');};
  rq.onsuccess=e=>res(e.target.result);rq.onerror=()=>res(null);});}
function tx(s,m){return DB.transaction(s,m).objectStore(s);}
function rq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const FB={
  get(s){try{return JSON.parse(localStorage.getItem('psm_'+s)||'[]');}catch(e){return[];}},
  set(s,v){try{localStorage.setItem('psm_'+s,JSON.stringify(v));return true;}
    catch(e){toast(t('msg.storageFull'));return false;}}};
async function dbAll(s){if(!DB)return FB.get(s);try{return await rq(tx(s,'readonly').getAll());}catch(e){return FB.get(s);}}
async function dbPut(s,v){
  if(!DB){const a=FB.get(s),i=a.findIndex(x=>x.id===v.id);if(i>=0)a[i]=v;else a.push(v);return FB.set(s,a);}
  try{await rq(tx(s,'readwrite').put(v));return true;}catch(e){toast(t('msg.saveFail'));return false;}}
async function dbDel(s,id){
  if(!DB){return FB.set(s,FB.get(s).filter(x=>x.id!==id));}
  try{await rq(tx(s,'readwrite').delete(id));return true;}catch(e){return false;}}
async function dbClear(s){
  if(!DB)return FB.set(s,[]);
  try{await rq(tx(s,'readwrite').clear());return true;}catch(e){return false;}}
async function metaGet(k){
  if(!DB){try{return JSON.parse(localStorage.getItem('psm_meta_'+k)||'null');}catch(e){return null;}}
  try{return await rq(tx('meta','readonly').get(k));}catch(e){return null;}}
async function metaSet(k,v){
  if(!DB){try{localStorage.setItem('psm_meta_'+k,JSON.stringify(v));}catch(e){}return;}
  try{await rq(tx('meta','readwrite').put(v,k));}catch(e){}}

const newId=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'r-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const normKey=s=>String(s||'').toLowerCase().replace(/[^a-z0-9@.]/g,'');
const loc=()=>LANG==='fr'?'fr-CA':'en-CA';
function fmtDate(iso){return new Date(iso).toLocaleDateString(loc(),{year:'numeric',month:'short',day:'numeric'});}
function fmtShort(iso){return new Date(iso).toLocaleDateString(loc(),{month:'short',day:'numeric'});}
function daysSince(iso){return Math.floor((Date.now()-new Date(iso).getTime())/86400000);}
function toast(m){const el=$('#tst');el.textContent=m;el.classList.add('on');clearTimeout(el._h);el._h=setTimeout(()=>el.classList.remove('on'),2400);}

/* ── 언어 ── */
function applyLang(){
  document.documentElement.lang=LANG==='fr'?'fr-CA':'en-CA';
  $('#lang-btn').textContent=LANG==='fr'?'FR':'EN';
  $$('[data-t]').forEach(el=>{el.innerHTML=t(el.dataset.t);});
  $$('[data-tp]').forEach(el=>{el.placeholder=t(el.dataset.tp);});
  $('#c-type').innerHTML=['podiatry','medical','advanced','salon']
    .map(k=>`<option value="${k}">${esc(t('ptype.'+k))}</option>`).join('');
  $('#mr-type').innerHTML=['podiatry','salon','physician','pharmacy']
    .map(k=>`<option value="${k}">${esc(t('rtype.'+k))}</option>`).join('');
  $('#lv-hint').textContent=t('s2.levelsHint');
  $('#home-disc').innerHTML=t('disc.main');
  $('#set-disc').innerHTML=t('disc.main');
  $('#s3-disc').innerHTML=t('s3.disc');
  $('#mp-imglbl').textContent=t('prod.choosePhoto');
  /* 관리 편집창이 열린 채로 언어를 바꾸면 안의 문구도 같이 바뀌어야 한다. */
  if($('#md-care').classList.contains('on')) openCare(editC?editC.id:null);
  applyCfg();
  if($('#v-new').style.display!=='none'){buildLevels();buildObs();setStepText();setSource(cur.src||'ai');}
  if($('#v-home').style.display!=='none')renderHome();
  if($('#v-rec').style.display!=='none')renderRecords();
  if($('#v-set').style.display!=='none')renderSetup();
  if($('#v-res').style.display!=='none'&&cur&&cur.id)rerunResult();
}
async function toggleLang(){LANG=LANG==='en'?'fr':'en';CFG.lang=LANG;await metaSet('cfg',CFG);applyLang();}

/* ── 네비게이션 ── */
const VIEWS=['home','new','res','rec','client','set'];
function go(v){
  VIEWS.forEach(x=>{const el=$('#v-'+x);if(el)el.style.display=x===v?'block':'none';});
  ['home','new','rec','set'].forEach(x=>$('#t-'+x).classList.toggle('on',x===v));
  if(v==='res'||v==='client')$$('.tb button').forEach(b=>b.classList.remove('on'));
  window.scrollTo(0,0);
  if(v==='home')renderHome();
  if(v==='rec')renderRecords();
  if(v==='set')renderSetup();
}
function jump(id){const el=document.getElementById(id);if(!el)return;
  window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-16,behavior:'smooth'});}
window.addEventListener('beforeprint',()=>$$('#res-body details').forEach(d=>{d._was=d.open;d.open=true;}));
window.addEventListener('afterprint',()=>$$('#res-body details').forEach(d=>{if(d._was===false)d.open=false;}));

function startNew(){
  cur={id:newId(),date:new Date().toISOString(),name:'',contact:'',foot:'Both',
       ms:{},obs:[],pain:'none',note:'',sizes:{},src:'ai',   /* 비워 둔다 — 0 은 '정상'이라는 뜻이라 안 본 것과 다르다 */
       aiUsed:false,aiDemo:false,aiConf:null,aiObs:[]};
  pendPhotos=[];aiShots={};aiResult=null;step=1;
  clearTimeout(readTimer);readKey='';
  $('#i-name').value='';$('#i-contact').value='';$('#i-note').value='';$('#i-consent').checked=false;
  $('#ai-out').style.display='none';aiState('');
  const rb=$('#ai-run'); if(rb)rb.style.display='none';
  /* 접어 둔 칸은 손님이 바뀌면 다시 접는다 — 앞사람 때 열어 둔 채로 시작하지 않게 */
  ['lv-fold','obs-fold','note-fold'].forEach(id=>{const d=$('#'+id); if(d)d.open=false;});
  renderShots();
  buildLevels();buildObs();renderPhotos();renderRecentChips();
  setSource('ai');goStep(1);go('new');
}
function setStepText(){
  const K=['s1','s2'][step-1];
  $('#nw-title').textContent=t(K+'.title');
  $('#nw-sub').textContent=t(K+'.sub');
}
function goStep(n){
  if(n===2&&step===1){
    const nm=$('#i-name').value.trim();
    if(!nm){toast(t('msg.needName'));return;}
    if(!$('#i-consent').checked){toast(t('msg.needConsent'));return;}
    cur.name=nm;cur.contact=$('#i-contact').value.trim();
  }
  step=n;
  ['s1','s2'].forEach((s,i)=>$('#'+s).style.display=(i+1)===n?'block':'none');
  setStepText();window.scrollTo(0,0);
}

/* ── STEP 2 ── */
/* 값이 없는 항목은 0 으로 두지 않는다 — 0 은 '정상'이라는 뜻이라
   안 찍힌 부위가 문제 없는 것처럼 결과에 실린다. 비워 두고 결과에서 뺀다. */
function buildLevels(){
  $('#levels').innerHTML=META.map(x=>{
    const v=cur.ms[x.k], un=(v==null);
    return `<div class="ms${un?' unset':''}" id="ms-${x.k}">
      <div class="t"><div><span class="k">${x.sub}</span> <span class="nm">${esc(tt(x.nm))}</span></div>
        <div class="lv" id="lv-${x.k}">${un?esc(t('s2.notSet')):v}</div></div>
      <div class="ds">${esc(tt(x.ds))}</div>
      <input type="range" min="0" max="10" step="1" value="${un?0:v}" data-k="${x.k}" oninput="setLevel(this)">
      <div class="sc"><span>${esc(t('s2.notNotable'))}</span><span>${esc(t('s2.pronounced'))}</span></div>
      ${un?`<div class="unsetnote">${esc(t('s2.notSetHint'))}</div>`:''}
    </div>`;}).join('');
  updateLvNote();
}
function updateLvNote(){

/* 자동 판독 — 간호사가 버튼을 찾을 필요가 없게 한다.
   세 컷을 각각 넣는 동안 매번 부르면 판독이 세 번 나가므로,
   마지막 사진을 넣고 잠시 조용해진 다음 한 번만 부른다. */
let readTimer=null, readKey='';
const shotKey=()=>SHOTS.filter(sh=>aiShots[sh.k]).map(sh=>sh.k+':'+(aiShots[sh.k]||'').length).join('|');
function scheduleRead(){
  if(cur.src!=='ai')return;

  clearTimeout(readTimer);
  aiState('<span class="spin"></span> '+esc(t('s2.aiReading')));
  readTimer=setTimeout(()=>{ if(shotKey()!==readKey) runAiReading(); }, 1100);
}
function aiState(html){
  const b=$('#ai-state'); if(!b)return;
  if(!html){b.style.display='none';return;}

async function runAiReading(manual){
  const taken=SHOTS.filter(sh=>aiShots[sh.k]);
  if(!taken.length){ if(manual)toast(t('s2.shotNone')); return; }
  if(!CFG.api&&!CFG.demo){ if(manual)toast(t('msg.needSetup')); return; }
  clearTimeout(readTimer);
  const btn=$('#ai-run');const label=btn.innerHTML;
  btn.disabled=true;
  aiState('<span class="spin"></span> '+esc(t('s2.aiRunning')));
  try{
    /* 판독에는 작게 줄여 보낸다 — 실측상 768px 이하로도 점수가 같고 비용은 절반이다.
       기기에 남는 사진과 화면에 보이는 사진은 원래 크기 그대로다.
       세 컷을 한 번에 보내 한 건으로 판독한다 — 컷마다 따로 부르면 비용이 세 배가 된다. */
    const imgs=[];
    for(const sh of taken) imgs.push({view:sh.k, data:await shrinkDataUrl(aiShots[sh.k],768,.8)});
    const r=await aiRead(imgs,cur.contact||$('#i-contact').value.trim());
    aiResult=r; readKey=shotKey();
    /* 판독된 항목만 채운다. 나머지는 실무자가 슬라이더로 직접 넣는다. */
    META.forEach(x=>{ if(r.levels[x.k]!=null) cur.ms[x.k]=r.levels[x.k]; });
    /* 소견도 그대로 체크해 준다 — 전에는 이걸 하나씩 눌러 넘겨야 했다.
       어디까지가 판독이 넣은 것인지 칩에 점으로 표시하고, 아니면 눌러서 끄면 된다. */
    cur.aiObs=(r.findings||[]).filter(isObsId);
    cur.aiObs.forEach(id=>{ if(!has(cur.obs,id)) cur.obs.push(id); });
    cur.aiUsed=true;cur.aiDemo=!!r.demo;cur.aiConf=r.confidence;cur.aiViews=taken.map(sh=>sh.k);
    buildLevels();buildObs();renderAiOut(r);
    aiState(esc(t('s2.aiApplied')));
    $('#ai-run').style.display='block';
    taken.forEach(sh=>{ const u=aiShots[sh.k];
      if(!pendPhotos.some(p=>p.url===u)) pendPhotos.push({id:newId(),view:sh.k,url:u}); });
    renderPhotos();
  }catch(e){
    $('#ai-out').style.display='none';
    aiState(`<span style="color:var(--warn)">${esc(t('s2.aiFail'))}</span>`);
    $('#ai-run').style.display='block';
  }
  btn.disabled=false;btn.innerHTML=label;
}

function shrink(file,max=1280,q=.82){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{let w=im.width,h=im.height;
        if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);res(cv.toDataURL('image/jpeg',q));};
      im.onerror=rej;im.src=fr.result;};
    fr.onerror=rej;fr.readAsDataURL(file);});
}
/* dataURL 을 다시 줄인다 (판독 전송용) */
function shrinkDataUrl(dataUrl,max,q){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{let w=im.width,h=im.height;
      if(w<=max&&h<=max) return res(dataUrl);
      const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(im,0,0,w,h);
      try{res(cv.toDataURL('image/jpeg',q));}catch(_){res(dataUrl);}};
    im.onerror=()=>res(dataUrl);
    im.src=dataUrl;});
}

async function saveAppt(){
  const d=$('#a-date').value; if(!d){toast(t('appt.needDate'));return;}
  cur.appt={date:d,time:$('#a-time').value||'',note:$('#a-note').value.trim()};
  await dbPut('records',{...cur,obs:[...cur.obs],out:buildOut(cur)});
  RECORDS=await dbAll('records');
  rerunResult();toast(t('appt.saved'));
}
async function rmAppt(){
  cur.appt=null;

  rerunResult();toast(t('appt.removed'));

function copyText(id){
  const txt=$('#'+id).textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(()=>toast(t('res.copied')),()=>fallbackCopy(txt));
  else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast(t('res.copied'));}catch(e){toast(t('res.copyManual'));}
  document.body.removeChild(ta);
}

function renderHome(){
  const now=new Date(), ym=now.getFullYear()+'-'+now.getMonth();
  const month=RECORDS.filter(r=>{const d=new Date(r.date);return d.getFullYear()+'-'+d.getMonth()===ym;});
  const clients=new Set(RECORDS.map(r=>normKey(r.contact||r.name)).filter(Boolean));
  const refs=RECORDS.filter(r=>r.out&&(r.out.tier==='C'||r.out.tier==='D'));
  $('#st-month').textContent=month.length;
  $('#st-clients').textContent=clients.size;
  $('#st-ref').textContent=refs.length;

  const byClient={};
  RECORDS.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(r=>{
    const k=normKey(r.contact||r.name);if(!k||byClient[k])return;byClient[k]=r;});
  /* 잡아 둔 예약 — Connected 에서만. 잡고 나서 다시 볼 데가 없으면 잡을 이유도 없다. */
  const grp=$('#ap-group'), today=new Date().toISOString().slice(0,10);
  if(isConnected()){
    const ap=RECORDS.filter(r=>r.appt&&r.appt.date&&r.appt.date>=today)
                    .sort((x,y)=>x.appt.date.localeCompare(y.appt.date)).slice(0,6);
    grp.style.display=ap.length?'block':'none';
    $('#ap-count').textContent=ap.length?ap.length:'';
    $('#ap-box').innerHTML=ap.map(r=>`<div class="kv" onclick="openClient('${normKey(r.contact||r.name)}')" style="cursor:pointer">
      <b>${esc(r.name||'')}</b><span>${esc(fmtDate(r.appt.date))}${r.appt.time?' · '+esc(r.appt.time):''}</span></div>`).join('');
    const shift=ap.length?1:0;
    $('#fu-no').textContent=shift?'02':'01';
    $('#rc-no').textContent=shift?'03':'02';
  }else{ grp.style.display='none'; $('#fu-no').textContent='01'; $('#rc-no').textContent='02'; }

  const due=Object.values(byClient).filter(r=>{
    const d=daysSince(r.date), tr=r.out&&r.out.tier;
    return d>=(tr==='D'?2:tr==='C'?28:tr==='B'?45:84);
  }).sort((a,b)=>new Date(a.date)-new Date(b.date));
  $('#fu-count').textContent=due.length?due.length+' '+t('home.due'):'';
  $('#fu-box').innerHTML=due.length?due.slice(0,5).map(r=>`
    <div class="rec" onclick="openClient('${normKey(r.contact||r.name)}')">
      <div class="av">${esc((r.name||'?').trim()[0]||'?')}</div>
      <div class="m"><b>${esc(r.name)}</b><span>${esc(t('home.lastSeen'))} ${fmtDate(r.date)} · ${daysSince(r.date)} ${esc(t('home.daysAgo'))}</span></div>
      <div class="s"><b>${r.out?r.out.score:'—'}</b><span>${esc(t('common.score'))}</span></div>
    </div>`).join('') : `<div class="em">${t('home.noFollow')}</div>`;

  const recent=RECORDS.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
  $('#home-recent').innerHTML=recent.length?recent.map(r=>`
    <div class="rec" onclick="openClient('${normKey(r.contact||r.name)}')">
      <div class="av">${esc((r.name||'?').trim()[0]||'?')}</div>
      <div class="m"><b>${esc(r.name)}</b><span>${fmtDate(r.date)}</span></div>
      <div class="s"><b>${r.out?r.out.score:'—'}</b><span>${r.out?esc(band(r.out.score)):''}</span></div>
    </div>`).join('') : `<div class="em">${t('home.noRecent')}</div>`;
}

function renderRecords(){
  const q=normKey($('#i-search').value), byClient={};
  RECORDS.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(r=>{
    const k=normKey(r.contact||r.name);if(!k)return;
    if(!byClient[k])byClient[k]={key:k,name:r.name,contact:r.contact,last:r.date,visits:0,score:r.out?r.out.score:null};
    byClient[k].visits++;});
  let list=Object.values(byClient);
  if(q)list=list.filter(c=>normKey(c.name).includes(q)||normKey(c.contact).includes(q));
  $('#rec-list').innerHTML=list.length?`<div class="c">`+list.map(c=>`
    <div class="rec" onclick="openClient('${c.key}')">
      <div class="av">${esc((c.name||'?').trim()[0]||'?')}</div>
      <div class="m"><b>${esc(c.name)}</b><span>${c.visits} ${esc(c.visits>1?t('rec.visits'):t('rec.visit'))} · ${esc(t('rec.last'))} ${fmtDate(c.last)}</span></div>
      <div class="s"><b>${c.score!=null?c.score:'—'}</b><span>${esc(t('common.score'))}</span></div>
    </div>`).join('')+`</div>`
    :`<div class="c"><div class="em">${q?t('rec.noMatch'):t('rec.none')}</div></div>`;
}
async function openClient(key){
  const visits=RECORDS.filter(r=>normKey(r.contact||r.name)===key).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!visits.length)return;
  const c=visits[0], media=await dbAll('media'), byRec={};
  media.forEach(m=>{(byRec[m.recId]=byRec[m.recId]||[]).push(m);});

  let h=`<button class="btn ghost sm" style="margin-bottom:14px" onclick="go('rec')">${esc(t('rec.all'))}</button>
    <h1 class="vt">${esc(c.name)}</h1>
    <p class="vs">${esc(c.contact||t('rec.noContact'))} · ${visits.length} ${esc(visits.length>1?t('rec.visits'):t('rec.visit'))}</p>`;

  /* 방문끼리 잇는 화면(추이·전후)은 Connected 기능이다 — Lite 에서는 내보내지 않는다. */
  const scored=isConnected()?visits.filter(v=>v.out&&v.out.score!=null).slice(0,6).reverse():[];
  let n=1;
  if(scored.length>1){
    const diff=scored[scored.length-1].out.score-scored[0].out.score;
    h+=`<div class="gl"><i>0${n++}</i> ${esc(t('rec.trend'))}</div><div class="c"><div class="tr">`
      +scored.map((v,i)=>`<div class="b"><em>${v.out.score}</em><i class="${i===scored.length-1?'last':''}" style="height:${Math.max(6,v.out.score*0.66)}px"></i><s>${fmtShort(v.date)}</s></div>`).join('')
      +`</div><div class="hr"></div><p class="p">${
        diff>0?`${t('rec.up')} ${diff} ${t('rec.pointsSince')} ${fmtDate(scored[0].date)}.`
       :diff<0?`${t('rec.down')} ${Math.abs(diff)} ${t('rec.pointsSince')} ${fmtDate(scored[0].date)}. ${t('rec.checkChanged')}`
       :`${t('rec.unchanged')} ${fmtDate(scored[0].date)}.`}</p></div>`;
  }
  const wp=isConnected()?visits.filter(v=>byRec[v.id]&&byRec[v.id].length).slice(0,2):[];
  if(wp.length===2){
    const a=byRec[wp[1].id][0], b=byRec[wp[0].id][0];
    h+=`<div class="gl"><i>0${n++}</i> ${esc(t('rec.thenNow'))}</div><div class="c">
      <div style="display:flex;gap:9px">
        <div style="flex:1"><div class="sm" style="font-weight:700;margin-bottom:5px">${fmtShort(wp[1].date)}</div>
          <div class="th" style="aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)"><img src="${a.url}" alt="" style="width:100%;height:100%;object-fit:cover" onclick="lbOpen(['${a.url}','${b.url}'],0)"></div></div>
        <div style="flex:1"><div class="sm" style="font-weight:700;margin-bottom:5px">${fmtShort(wp[0].date)}</div>
          <div class="th" style="aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)"><img src="${b.url}" alt="" style="width:100%;height:100%;object-fit:cover" onclick="lbOpen(['${a.url}','${b.url}'],1)"></div></div>
      </div><p class="sm" style="margin-top:9px">${esc(t('rec.thenNowHint'))}</p></div>`;
  }
  h+=`<div class="gl"><i>0${n}</i> ${esc(t('rec.visitsTitle'))}</div>`;
  visits.forEach(v=>{
    const ph=byRec[v.id]||[], tr=v.out&&v.out.tier;
    const tag=tr==='D'?`<span class="pill" style="background:var(--tintr);color:var(--red);border-color:#E8B7B3">${esc(t('rec.referredUrgent'))}</span>`
             :tr==='C'?`<span class="pill" style="background:var(--tintw);color:var(--warn);border-color:#EBD5AE">${esc(t('rec.referred'))}</span>`:'';
    h+=`<div class="c"><div class="ch"><h3>${fmtDate(v.date)}</h3><span class="no">${v.out?v.out.score:'—'} / 100</span></div>

      <div class="kv"><b>${esc(t('rec.levels'))}</b><span>${META.map(x=>x.sub+' '+v.ms[x.k]).join(' · ')}</span></div>
      ${v.pain&&v.pain!=='none'?`<div class="kv"><b>${esc(t('rec.painK'))}</b><span>${esc(obsLabel(v.pain))}</span></div>`:''}
      ${v.obs&&v.obs.length?`<div class="kv"><b>${esc(t('rec.observed'))}</b><span>${v.obs.map(o=>esc(obsLabel(o))).join(', ')}</span></div>`:''}
      ${v.note?`<div class="kv"><b>${esc(t('rec.notesK'))}</b><span>${esc(v.note)}</span></div>`:''}
      ${tag?`<div style="margin-top:9px">${tag}</div>`:''}
      ${ph.length?`<div class="pg" style="margin-top:10px">`+ph.map((p,i)=>`<div class="th"><img src="${p.url}" alt="" onclick="lbOpen(${JSON.stringify(ph.map(x=>x.url)).replace(/"/g,'&quot;')},${i})"></div>`).join('')+`</div>`:''}
      <button class="btn ghost sm" style="width:100%;margin-top:11px;color:var(--red);border-color:#E8B7B3" onclick="delVisit('${v.id}')">${esc(t('rec.delVisit'))}</button>
    </div>`;});
  h+=`<div class="disc">${t('disc.main')}</div>`;
  $('#client-body').innerHTML=h;go('client');
}
async function delVisit(id){
  if(!confirm(t('rec.delConfirm')))return;
  await dbDel('records',id);
  const media=await dbAll('media');
  for(const m of media.filter(x=>x.recId===id)) await dbDel('media',m.id);
  RECORDS=await dbAll('records');toast(t('rec.deleted'));go('rec');
}
