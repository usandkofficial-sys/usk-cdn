function applyCfg(){
  $('#hd-clinic').textContent=CFG.clinic||t('hd.noClinic');
  $('#hd-user').textContent=CFG.user||(CFG.clinic?typeName(CFG.type):t('hd.noUser'));
  /* 국외이전 고지 — 클리닉이 설정에 적어 두면 손님 동의 화면에 그대로 보인다.
     비워 두면 아무것도 뜨지 않는다(문안은 각 클리닉이 자기 법무 기준으로 정한다). */
  const tr=$('#s1-transfer');
  if(tr){ const txt=transferText().trim();
    tr.textContent=txt; tr.style.display=txt?'block':'none'; }
}

/* ── 우리 클리닉 관리 ───────────────────────────────────────
   관리 항목을 코드에 박아 두지 않는다. PROC 는 첫 실행 때 심어 주는 프리셋일 뿐이고,
   결과 화면은 CFG.care 만 본다 — 설정에서 보이는 것이 결과에 나오는 것과 같다.
   ⛔ 진행 단계(어떻게 하는지)는 넣지 않는다. 이 앱은 무엇이 있는지까지만 적는다. */
function presetCare(){
  return CARE_SEED.map((sd,i)=>{ const pr=PROC[sd.k];
    return {id:'c_'+sd.k, on:true, ord:i+1, nm:{...pr.t}, ds:{...pr.d},
            scope:pr.scope, trig:sd.trig.slice(), mins:'', cost:''}; });
}
/* 조건이 하나라도 맞으면 나온다(OR). 조건을 안 고른 항목은 나오지 않는다. */
function careFor(out){
  const hits=out.hits||[];
  return (CFG.care||[]).filter(c=>c.on!==false&&Array.isArray(c.trig)&&c.trig.some(k=>has(hits,k)))
                       .sort((a,b)=>(a.ord||99)-(b.ord||99));
}
const trigName=k=>{const x=TRIGS.find(v=>v.k===k);return x?tt(x.nm):k;};
const trigNames=a=>(Array.isArray(a)&&a.length)?a.map(trigName).join(' · '):'—';

function openCare(id){
  editC=(typeof id==='string')?(CFG.care||[]).find(c=>c.id===id):null;
  $('#mc-title').textContent=editC?t('care.editTitle'):t('care.addTitle');
  $('#mc-scope').innerHTML=['routine','advanced','medical']
    .map(k=>`<option value="${k}">${esc(scopeName(k))}</option>`).join('');
  $('#mc-nm-en').value=editC?(editC.nm&&editC.nm.en||''):'';
  $('#mc-nm-fr').value=editC?(editC.nm&&editC.nm.fr||''):'';
  $('#mc-ds-en').value=editC?(editC.ds&&editC.ds.en||''):'';
  $('#mc-ds-fr').value=editC?(editC.ds&&editC.ds.fr||''):'';
  $('#mc-scope').value=editC?(editC.scope||'routine'):'routine';
  $('#mc-mins').value=editC?(editC.mins||''):'';
  $('#mc-cost').value=editC?(editC.cost||''):'';
  $('#mc-ord').value=editC?(editC.ord||1):((CFG.care||[]).length+1);
  const on=editC?(editC.trig||[]):[];
  $('#mc-trigs').innerHTML=TRIGS.map(x=>
    `<button type="button" class="chip${has(on,x.k)?' on':''}" data-trig="${x.k}"
      onclick="this.classList.toggle('on')">${esc(tt(x.nm))}</button>`).join('');
  $('#mc-del').style.display=editC?'flex':'none';
  $('#md-care').classList.add('on');
}
async function saveCare(){
  const en=$('#mc-nm-en').value.trim(), fr=$('#mc-nm-fr').value.trim();
  if(!en&&!fr){toast(t('care.needName'));return;}
  const trig=$$('#mc-trigs .chip.on').map(c=>c.dataset.trig);
  if(!trig.length){toast(t('care.needTrig'));return;}
  /* 비워 둔 프랑스어는 키 자체를 안 넣는다 — tt() 가 영어로 되돌아가야 하므로 빈 문자열을 넣으면 안 된다. */
  const pair=(a,b)=>{const o={en:a||b}; if(b)o.fr=b; return o;};
  const dEn=$('#mc-ds-en').value.trim(), dFr=$('#mc-ds-fr').value.trim();
  const c={id:editC?editC.id:newId(), on:editC?editC.on!==false:true,
           ord:Math.max(1,Math.min(99,parseInt($('#mc-ord').value,10)||1)),
           nm:pair(en,fr), ds:pair(dEn,dFr), scope:$('#mc-scope').value, trig:trig,
           mins:$('#mc-mins').value.trim(), cost:$('#mc-cost').value.trim()};
  if(!Array.isArray(CFG.care))CFG.care=[];
  const i=CFG.care.findIndex(x=>x.id===c.id);
  if(i>=0)CFG.care[i]=c; else CFG.care.push(c);
  await metaSet('cfg',CFG);closeMd('md-care');renderSetup();toast(t('care.savedMsg'));
}
async function delCare(){
  if(!editC)return;
  CFG.care=(CFG.care||[]).filter(c=>c.id!==editC.id);
  await metaSet('cfg',CFG);closeMd('md-care');renderSetup();toast(t('care.removedMsg'));
}
async function toggleCare(id){
  const c=(CFG.care||[]).find(x=>x.id===id); if(!c)return;
  c.on=c.on===false;
  await metaSet('cfg',CFG);renderSetup();
}
async function resetCare(){
  if(!confirm(t('care.resetAsk')))return;
  CFG.care=presetCare();
  await metaSet('cfg',CFG);renderSetup();toast(t('care.resetMsg'));
}

/* 제품 */
function openProd(id){
  editP=(typeof id==='string')?CATALOGUE.find(p=>p.id===id):null;
  $('#mp-title').textContent=editP?t('prod.editTitle'):t('prod.addTitle');
  $('#mp-cat').innerHTML=PCATS.map(c=>`<option value="${c.k}">${esc(tt(c.nm))}</option>`).join('');
  $('#mp-name').value=editP?editP.name:'';$('#mp-cat').value=editP?editP.cat:PCATS[0].k;
  $('#mp-size').value=editP?(editP.size||''):'';$('#mp-how').value=editP?(editP.how||''):'';
  $('#mp-price').value=editP?(editP.price||''):'';$('#mp-url').value=editP?(editP.url||''):'';
  $('#mp-imglbl').textContent=(editP&&editP.img)?t('prod.photoAdded'):t('prod.choosePhoto');
  $('#mp-img')._data=editP?editP.img:null;
  $('#mp-del').style.display=editP?'flex':'none';
  $('#md-prod').classList.add('on');
}
$('#mp-img').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{$('#mp-img')._data=await shrink(f,480,.85);$('#mp-imglbl').textContent=t('prod.photoAdded');}
  catch(_){toast(t('msg.photoFail'));}
});
async function saveProd(){
  const nm=$('#mp-name').value.trim();
  if(!nm){toast(t('prod.needName'));return;}
  const p={id:editP?editP.id:newId(),name:nm,cat:$('#mp-cat').value,size:$('#mp-size').value.trim(),
    how:$('#mp-how').value.trim(),price:$('#mp-price').value.trim(),url:$('#mp-url').value.trim(),img:$('#mp-img')._data||null};
  if(editP){CATALOGUE[CATALOGUE.findIndex(x=>x.id===editP.id)]=p;}else CATALOGUE.push(p);
  await metaSet('catalogue',CATALOGUE);closeMd('md-prod');renderSetup();toast(t('prod.savedMsg'));
}
async function delProd(){
  if(!editP)return;
  CATALOGUE=CATALOGUE.filter(p=>p.id!==editP.id);
  await metaSet('catalogue',CATALOGUE);closeMd('md-prod');renderSetup();toast(t('prod.removed'));
}
/* 리퍼럴 파트너 */

  editR=(typeof id==='string')?REFS.find(r=>r.id===id):null;
  $('#mr-title').textContent=editR?t('ref.editTitle'):t('ref.addTitle');
  $('#mr-type').value=editR?editR.type:'podiatry';
  $('#mr-name').value=editR?editR.name:'';$('#mr-clinic').value=editR?(editR.clinic||''):'';
  $('#mr-phone').value=editR?(editR.phone||''):'';$('#mr-addr').value=editR?(editR.addr||''):'';
  $('#mr-note').value=editR?(editR.note||''):'';
  $('#mr-del').style.display=editR?'flex':'none';
  $('#md-ref').classList.add('on');
}
async function saveRef(){
  const nm=$('#mr-name').value.trim();
  if(!nm){toast(t('ref.needName'));return;}
  const r={id:editR?editR.id:newId(),type:$('#mr-type').value,name:nm,clinic:$('#mr-clinic').value.trim(),
    phone:$('#mr-phone').value.trim(),addr:$('#mr-addr').value.trim(),note:$('#mr-note').value.trim()};
  if(editR){REFS[REFS.findIndex(x=>x.id===editR.id)]=r;}else REFS.push(r);
  await metaSet('refs',REFS);closeMd('md-ref');renderSetup();toast(t('ref.savedMsg'));
}
async function delRef(){
  if(!editR)return;
  REFS=REFS.filter(r=>r.id!==editR.id);
  await metaSet('refs',REFS);closeMd('md-ref');renderSetup();toast(t('ref.removed'));
}
function closeMd(id){$('#'+id).classList.remove('on');}
$$('.md').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on');}));

async function exportData(){
  const recs=await dbAll('records'), media=await dbAll('media');
  const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),clinic:CFG,refs:REFS,
    catalogue:CATALOGUE,records:recs,media:media},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='pediscan-mobile-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(t('set.exported'));
}
async function wipeAll(){
  if(!confirm(t('set.wipe1')))return;
  if(!confirm(t('set.wipe2')))return;
  await dbClear('records');await dbClear('media');
  RECORDS=[];toast(t('set.wiped'));renderSetup();
}

/* ── 라이트박스 ── */
let lbList=[],lbI=0;
function lbOpen(list,i){lbList=list||[];lbI=i||0;$('#lb').style.display='block';document.body.style.overflow='hidden';lbShow();}
function lbShow(){
  if(!lbList.length)return;
  $('#lb-img').src=lbList[lbI];
  $('#lb-ct').textContent=(lbI+1)+' '+t('common.of')+' '+lbList.length;
  $$('.lb .nv').forEach(b=>b.style.display=lbList.length>1?'flex':'none');
}
function lbGo(d){if(lbList.length<2)return;lbI=(lbI+d+lbList.length)%lbList.length;lbShow();}
function lbClose(){$('#lb').style.display='none';document.body.style.overflow='';}
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')lbClose();});

/* ── 시작 ── */
async function boot(){
  DB=await idbOpen();
  const cfg=await metaGet('cfg'); if(cfg)CFG={...CFG,...cfg};
  /* ── 테스트 배포본 ──────────────────────────────────────
     플랜은 주소가 정한다(/lite · /connected). 새로고침해도 그 주소의 플랜으로 돌아온다.
     판독 키는 공개 주소에 넣지 않는다 — 처음 열 때는 데모 판독으로 시작하고,
     설정에서 주소·키를 넣으면 그때부터 실제 판독을 쓴다. */
  const __p=(new URLSearchParams(location.search).get('plan')||
             (/connected/i.test(location.pathname)?'connected':
              /lite/i.test(location.pathname)?'lite':''));
  if(__p==='lite'||__p==='connected') CFG.plan=__p;
  if(!cfg){ CFG.api=''; CFG.demo=true; }
  { const b=document.getElementById('rv-plan');
    if(b) b.textContent=(CFG.plan==='connected'?'CONNECTED':'LITE'); }
  /* 관리 목록이 없는 기기에만 기본 7종을 심는다. 한 번 심으면 클리닉 것이라 다시 덮지 않는다. */
  if(!Array.isArray(CFG.care)){ CFG.care=presetCare(); await metaSet('cfg',CFG); }
  if(CFG.lang==='fr'||CFG.lang==='en')LANG=CFG.lang;
  else if((navigator.language||'').toLowerCase().startsWith('fr'))LANG='fr';
  const refs=await metaGet('refs'); if(Array.isArray(refs))REFS=refs;
  const cat=await metaGet('catalogue'); if(Array.isArray(cat))CATALOGUE=cat;
  RECORDS=await dbAll('records');
  cur={ms:{cnl:0,una:0,cls:0,cot:0},obs:[],pain:'none',sizes:{},src:'ai'};
  applyLang();renderHome();
}
boot();
